# CI: lint, build, behaviour tests and a vulnerability scan, on every pull request and on main.
# Nothing here is published and no secret is used. The trigger is pull_request (never
# pull_request_target), so code from other people's pull requests runs with a read-only token and
# without access to secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Trivy, pinned by version and digest like every other tool image (tests/lint.sh).
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  podman:
    name: Podman Quadlet (system-wide and rootless)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image (version from versions.env)
        run: |
          version="$(scripts/versions.sh get ASPIA_VERSION)"
          docker build --platform linux/amd64 \
            --build-arg "ASPIA_VERSION=${version}" \
            --build-arg "IMAGE_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t aspia-server:ci .

      - name: diagnostic (temporary)
        run: tests/diag-signal.sh

      - name: tests/podman.sh
        env:
          ASPIA_TEST_IMAGE: aspia-server:ci
        run: tests/podman.sh

