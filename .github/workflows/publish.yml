# Publish: build the image once, push it to GHCR by digest only, run tests/run.sh against that
# digest, and only then give it its tags in GHCR and copy it (same digest) to Docker Hub and Quay.io
# when their secrets are set. The digest is signed with cosign (keyless) and attested (SLSA build
# provenance); BuildKit attaches an SBOM and provenance to the image itself.
# Works unchanged in any fork: image names default to <repository owner>/aspia-server.
# See docs/ci.md for the secrets and variables.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - versions.env
      - Dockerfile
      - .dockerignore
      - aspia_start
      - aspia_health
      - aspia_common.sh
  schedule:
    # Weekly rebuild (Mondays 03:41 UTC): picks up Debian security updates of the packages the
    # image installs, and adds an immutable X.Y.Z-YYYYMMDD tag.
    - cron: '41 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Aspia version to publish. Must equal ASPIA_VERSION in versions.env of the branch selected
          above (checksums exist only for that version).
        required: true
        type: string
      dated_tag:
        description: Also push the immutable X.Y.Z-YYYYMMDD tag (the weekly rebuild always does).
        required: false
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Version, tags and registries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}
      dated_tag: ${{ steps.plan.outputs.dated_tag }}
      created: ${{ steps.plan.outputs.created }}
      dockerhub: ${{ steps.plan.outputs.dockerhub }}
      quay: ${{ steps.plan.outputs.quay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DATED_TAG: ${{ inputs.dated_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          scripts/versions.sh check
          version="$(scripts/versions.sh get ASPIA_VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${INPUT_VERSION}" != "${version}" ]]; then
            echo "::error::The input version '${INPUT_VERSION}' is not ASPIA_VERSION=${version} in versions.env of ${GITHUB_REF_NAME}. Run the workflow from a branch or tag whose versions.env has that version."
            exit 1
          fi
          minor="${version%.*}"
          major="${version%%.*}"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dated_tag=""
          if [[ "${GITHUB_EVENT_NAME}" == schedule || "${INPUT_DATED_TAG}" == true ]]; then
            dated_tag="${version}-$(date -u +%Y%m%d)"
          fi
          {
            echo "version=${version}"
            echo "tags=${version} ${minor} ${major} latest"
            echo "dated_tag=${dated_tag}"
            echo "created=${created}"
          } >> "${GITHUB_OUTPUT}"

          # Optional registries are enabled by their secrets. Missing secrets are not an error.
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "dockerhub=true" >> "${GITHUB_OUTPUT}"
            echo "Docker Hub: enabled"
          else
            echo "dockerhub=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Docker Hub skipped::Secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not both set; not publishing to Docker Hub."
          fi
          if [[ -n "${QUAY_USERNAME}" && -n "${QUAY_TOKEN}" ]]; then
            echo "quay=true" >> "${GITHUB_OUTPUT}"
            echo "Quay.io: enabled"
          else
            echo "quay=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Quay.io skipped::Secrets QUAY_USERNAME and QUAY_TOKEN are not both set; not publishing to Quay.io."
          fi
          echo "Aspia ${version}: tags ${version} ${minor} ${major} latest ${dated_tag}"

  publish:
    name: Build, test, publish ${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Two publishes of the same version never run at once; a second one waits.
    concurrency:
      group: publish-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # keyless signing (cosign) and the provenance attestation
      attestations: write   # store the provenance attestation in GitHub
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAGS: ${{ needs.prepare.outputs.tags }}
      DATED_TAG: ${{ needs.prepare.outputs.dated_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Computed here, not passed from the prepare job: GitHub drops a job output that contains a
      # secret's value, and <owner>/aspia-server usually contains DOCKERHUB_USERNAME.
      - name: Image names
        env:
          OWNER: ${{ github.repository_owner }}
          VAR_GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
          VAR_DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          VAR_QUAY_IMAGE: ${{ vars.QUAY_IMAGE }}
        run: scripts/image-names.sh | tee -a "${GITHUB_ENV}"

      # use: false keeps "docker build" in tests/run.sh on the default builder, which loads images
      # into the local image store; a docker-container builder would leave them in its cache only.
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: nothing points at this image until it has passed the tests.
      # No cache and a fresh pull, so that the weekly rebuild gets current Debian packages.
      - name: Build and push to GHCR by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          build-args: |
            ASPIA_VERSION=${{ needs.prepare.outputs.version }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
          annotations: |
            index:org.opencontainers.image.title=Aspia Server
            index:org.opencontainers.image.description=Aspia Router and Aspia Relay in one container
            index:org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.licenses=GPL-3.0-only
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: tests/run.sh against the pushed digest
        env:
          ASPIA_TEST_IMAGE: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
        run: tests/run.sh

      # imagetools create copies the index as it is, so every tag and every registry gets the digest
      # that was tested (checked below).
      - name: Tag in GHCR
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          args=()
          for tag in ${TAGS}; do args+=(--tag "${GHCR_IMAGE}:${tag}"); done
          if [[ -n "${DATED_TAG}" ]]; then
            if docker buildx imagetools inspect "${GHCR_IMAGE}:${DATED_TAG}" >/dev/null 2>&1; then
              echo "::notice::${GHCR_IMAGE}:${DATED_TAG} already exists and is immutable; not moving it."
            else
              args+=(--tag "${GHCR_IMAGE}:${DATED_TAG}")
            fi
          fi
          docker buildx imagetools create "${args[@]}" "${GHCR_IMAGE}@${DIGEST}"

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay.io
        if: needs.prepare.outputs.quay == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Copy to Docker Hub and Quay.io
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.prepare.outputs.dockerhub }}
          QUAY: ${{ needs.prepare.outputs.quay }}
        run: |
          copy() {
            local image="$1" tag args=()
            for tag in ${TAGS}; do args+=(--tag "${image}:${tag}"); done
            if [[ -n "${DATED_TAG}" ]]; then
              if docker buildx imagetools inspect "${image}:${DATED_TAG}" >/dev/null 2>&1; then
                echo "::notice::${image}:${DATED_TAG} already exists and is immutable; not moving it."
              else
                args+=(--tag "${image}:${DATED_TAG}")
              fi
            fi
            docker buildx imagetools create "${args[@]}" "${GHCR_IMAGE}@${DIGEST}"
          }
          if [[ "${DOCKERHUB}" == true ]]; then copy "${DOCKERHUB_IMAGE}"; else echo "Docker Hub: skipped (secrets not set)"; fi
          if [[ "${QUAY}" == true ]]; then copy "${QUAY_IMAGE}"; else echo "Quay.io: skipped (secrets not set)"; fi

      - name: Check that every pushed tag has the tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.prepare.outputs.dockerhub }}
          QUAY: ${{ needs.prepare.outputs.quay }}
        run: |
          images=("${GHCR_IMAGE}")
          [[ "${DOCKERHUB}" != true ]] || images+=("${DOCKERHUB_IMAGE}")
          [[ "${QUAY}" != true ]] || images+=("${QUAY_IMAGE}")
          status=0
          for image in "${images[@]}"; do
            for tag in ${TAGS} ${DATED_TAG}; do
              got="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${image}:${tag}" | jq -r .digest)"
              if [[ "${got}" == "${DIGEST}" ]]; then
                echo "ok   ${image}:${tag} ${got}"
              elif [[ "${tag}" == "${DATED_TAG}" ]]; then
                echo "::notice::${image}:${tag} keeps its earlier digest ${got} (immutable tag)"
              else
                echo "::error::${image}:${tag} has digest ${got}, expected the tested ${DIGEST}"
                status=1
              fi
            done
          done
          exit "${status}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest (cosign, keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.prepare.outputs.dockerhub }}
          QUAY: ${{ needs.prepare.outputs.quay }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          [[ "${DOCKERHUB}" != true ]] || cosign sign --yes "${DOCKERHUB_IMAGE}@${DIGEST}"
          [[ "${QUAY}" != true ]] || cosign sign --yes "${QUAY_IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.prepare.outputs.dockerhub }}
          QUAY: ${{ needs.prepare.outputs.quay }}
          REPOSITORY: ${{ github.repository }}
        run: |
          images=("${GHCR_IMAGE}")
          [[ "${DOCKERHUB}" != true ]] || images+=("${DOCKERHUB_IMAGE}")
          [[ "${QUAY}" != true ]] || images+=("${QUAY_IMAGE}")
          {
            echo "## Published Aspia ${VERSION}"
            echo
            echo "Digest (tested with tests/run.sh, identical in every registry): \`${DIGEST}\`"
            echo
            echo "Pin a release by digest:"
            echo
            echo '```'
            for image in "${images[@]}"; do echo "${image}@${DIGEST}"; done
            echo '```'
            echo
            echo "Tags: ${TAGS} ${DATED_TAG} (latest, ${VERSION%%.*} and ${VERSION%.*} are for convenience; nothing in the repository uses them)."
            echo
            [[ "${DOCKERHUB}" == true ]] || echo "- Docker Hub: skipped, secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN not set."
            [[ "${QUAY}" == true ]] || echo "- Quay.io: skipped, secrets QUAY_USERNAME and QUAY_TOKEN not set."
            echo
            echo "Verify:"
            echo
            echo '```'
            echo "cosign verify ${GHCR_IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^${GITHUB_SERVER_URL}/${REPOSITORY}/\\.github/workflows/publish\\.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${GHCR_IMAGE}@${DIGEST} -R ${REPOSITORY}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  dockerhub-description:
    name: Docker Hub description from README.md
    needs: [prepare, publish]
    if: needs.prepare.outputs.dockerhub == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository name on Docker Hub
        id: repo
        env:
          OWNER: ${{ github.repository_owner }}
          VAR_DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          image="$(scripts/image-names.sh | sed -n 's/^DOCKERHUB_IMAGE=//p')"
          echo "repository=${image#docker.io/}" >> "${GITHUB_OUTPUT}"
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.repo.outputs.repository }}
          short-description: Aspia Router and Aspia Relay in one container (linux/amd64)
          readme-filepath: ./README.md
          enable-url-completion: true
