services:
  aspia-server:
    # By default the image is built from this repository: docker compose up -d --build
    # (the build pins its base image and checks the Aspia packages against checksums.sha256).
    # To run a published image instead, set ASPIA_IMAGE in .env, pinned to a version or a digest,
    # e.g. ASPIA_IMAGE=ghcr.io/<owner>/aspia-server:3.0.21, then docker compose pull (no --build).
    image: ${ASPIA_IMAGE:-aspia-server:3.0.21}
    build: .
    container_name: aspia-server
    hostname: aspia-server
    environment:
      # Required (or set ASPIA_RELAY_PUBLIC_ADDRESS instead): the public address of this server,
      # announced by the Relay to clients and hosts. 'auto' detects it at startup. Not marked
      # ":?" here on purpose, so that setting only ASPIA_RELAY_PUBLIC_ADDRESS below still works;
      # the container itself refuses to start if neither is set. See .env.example and README.md
      # for the full list of variables below (every one is optional: unset = the file is left
      # alone, so a hand edit of router.conf/relay.conf survives).
      - EXTERNAL_IP=${EXTERNAL_IP:-}
      - ASPIA_RELAY_PUBLIC_ADDRESS=${ASPIA_RELAY_PUBLIC_ADDRESS:-}
      - ASPIA_RELAY_PEER_PORT
      - ASPIA_RELAY_IDLE_TIMEOUT
      - ASPIA_RELAY_MAX_PEERS
      - ASPIA_ROUTER_CLIENT_PORT
      - ASPIA_ROUTER_HOST_PORT
      - ASPIA_ROUTER_LEGACY_PORT
      - ASPIA_ROUTER_STUN_ENABLED
      - ASPIA_ROUTER_STUN_PORT
      - ASPIA_ROUTER_CLIENT_ALLOWED_IPS
      - ASPIA_ROUTER_HOST_ALLOWED_IPS
      - ASPIA_ROUTER_RELAY_ALLOWED_IPS
      - ASPIA_LOG_LEVEL
      - TZ
      - PUID
      - PGID
    volumes:
      - ./data/config:/etc/aspia:rw
      - ./data/database:/var/lib/aspia:rw
    # Publish every port one-to-one (host port = container port): the Relay announces its own
    # peer port (ASPIA_RELAY_PEER_PORT) to clients and hosts, so a different host port would break
    # relayed connections. Both sides of every mapping come from the same variable, with the
    # upstream default when it is not set, so the ports here always match what aspia_start writes
    # into router.conf/relay.conf.
    ports:
      - "${ASPIA_ROUTER_LEGACY_PORT:-8060}:${ASPIA_ROUTER_LEGACY_PORT:-8060}"       # Router: hosts of Aspia 2.x
      - "${ASPIA_ROUTER_HOST_PORT:-8061}:${ASPIA_ROUTER_HOST_PORT:-8061}"           # Router: hosts of Aspia 3.x
      - "${ASPIA_ROUTER_CLIENT_PORT:-8062}:${ASPIA_ROUTER_CLIENT_PORT:-8062}"       # Router: clients (address book and Router management)
      - "${ASPIA_ROUTER_STUN_PORT:-8065}:${ASPIA_ROUTER_STUN_PORT:-8065}/udp"       # Router: built-in STUN server
      - "${ASPIA_RELAY_PEER_PORT:-8070}:${ASPIA_RELAY_PEER_PORT:-8070}"             # Relay: clients and hosts
      # 8063 is the Router port for Relays. The Relay in this container reaches it internally;
      # publish it only for a Relay running on another machine (not configurable in this PR).
    restart: unless-stopped
